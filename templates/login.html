<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سیستم</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f2f5; }
        .login-box { background: #fff; padding: 35px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,.1); width: 350px; }
        h2 { text-align: center; margin-bottom: 25px; color: #333; }
        label { display: block; margin-bottom: 7px; font-size: 14px; color: #444; }
        input { width: 100%; padding: 10px; margin-bottom: 18px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { width: 100%; padding: 11px; background: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
        button:hover { background: #0069d9; }
        .error { background: #f8d7da; color: #842029; padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>ورود مدیر</h2>
        {% if error %}
            <div class="error">نام کاربری یا رمز عبور اشتباه است.</div>
        {% endif %}
        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">نام کاربری</label>
            <input type="text" id="username" name="username" required>
            <label for="password">رمز عبور</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">ورود</button>
        </form>
    </div>
</body>
</html>
