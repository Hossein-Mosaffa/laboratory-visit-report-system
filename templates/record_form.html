<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت رکورد بازدید</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f0f2f5;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-size: 14px;
            color: #444;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .submit-btn {
            background: #28a745;
            color: #fff;
        }

        .back-btn {
            background: #6c757d;
            color: #fff;
            text-decoration: none;
            display: inline-block;
            line-height: 22px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ثبت رکورد بازدید و ارزیابی</h2>

        <form method="POST" action="{{ url_for('submit_record_form') }}">
            <label for="laboratory_id">آزمایشگاه</label>
            <select id="laboratory_id" name="laboratory_id" required>
                <option value="">انتخاب کنید</option>

                {% for laboratory in laboratories %}
                    <option value="{{ laboratory[0] }}">
                        {{ laboratory[1] }} - {{ laboratory[2] }}
                    </option>
                {% endfor %}
            </select>

            <label for="certificate_validity_date">تاریخ اعتبار گواهینامه</label>
            <input type="date" id="certificate_validity_date" name="certificate_validity_date" required>

            <label for="evaluation_type">نوع ارزیابی</label>
            <select id="evaluation_type" name="evaluation_type" required>
                <option value="">انتخاب کنید</option>
                <option value="اولیه">اولیه</option>
                <option value="پایش">پایش</option>
                <option value="تجدید">تجدید</option>
                <option value="پیگیری">پیگیری</option>
            </select>

            <label for="evaluation_date">تاریخ ارزیابی</label>
            <input type="date" id="evaluation_date" name="evaluation_date" required>

            <label for="evaluation_team_members">اعضای تیم ارزیابی</label>
            <textarea id="evaluation_team_members" name="evaluation_team_members" required></textarea>

            <label for="evaluation_result">نتیجه ارزیابی</label>
            <select id="evaluation_result" name="evaluation_result" required>
                <option value="">انتخاب کنید</option>
                <option value="قبول">قبول</option>
                <option value="قبول مشروط">قبول مشروط</option>
                <option value="عدم قبولی">عدم قبولی</option>
            </select>

            <label for="non_conformance_count">تعداد موارد عدم انطباق</label>
            <input type="number" id="non_conformance_count" name="non_conformance_count" min="0" value="0" required>

            <label for="non_conformance_deadline">مهلت رفع عدم انطباق</label>
            <input type="date" id="non_conformance_deadline" name="non_conformance_deadline">

            <label for="follow_up_evaluation_date">تاریخ ارزیابی پیگیری</label>
            <input type="date" id="follow_up_evaluation_date" name="follow_up_evaluation_date">

            <label for="file_submission_date">تاریخ ارسال پرونده به کمیته</label>
            <input type="date" id="file_submission_date" name="file_submission_date">

            <label for="committee_meeting_date">تاریخ برگزاری کمیته فنی</label>
            <input type="date" id="committee_meeting_date" name="committee_meeting_date">

            <label for="committee_result">نتیجه کمیته</label>
            <input type="text" id="committee_result" name="committee_result">

            <label for="technical_manager">مدیر فنی</label>
            <input type="text" id="technical_manager" name="technical_manager" required>

            <label for="registrant">ثبت‌کننده</label>
            <input type="text" id="registrant" name="registrant" required>

            <div class="buttons">
                <button type="submit" class="submit-btn">ثبت رکورد</button>
                <a href="{{ url_for('records_page') }}" class="back-btn">بازگشت</a>
            </div>
        </form>
    </div>

</body>
</html>
